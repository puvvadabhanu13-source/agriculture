        const qty = quantity || product.minOrderQuantity || 1;
        setCart(prev => {
          const exists = prev.find(item => item.product.id === product.id);
          if (exists) {
            return prev.map(item => item.product.id === product.id ? { ...item, quantity: item.quantity + qty } : item);
          }
          return [...prev, { product, quantity: qty }];
        });
        showToast(`✓ Added ${qty} ${product.unit}s of ${product.name} to cart!`);
      };

      const updateCartQty = (productId, newQty) => {
        if (newQty <= 0) {
          setCart(prev => prev.filter(item => item.product.id !== productId));
        } else {
          setCart(prev => prev.map(item => item.product.id === productId ? { ...item, quantity: newQty } : item));
        }
      };

      const totalCartItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const subtotal = cart.reduce((sum, item) => {
        const isBulk = item.product.bulkMinQuantity && item.quantity >= item.product.bulkMinQuantity;
        const unitPrice = isBulk 
          ? item.product.pricePerUnit * (1 - item.product.bulkDiscountPercentage / 100) 
          : item.product.pricePerUnit;
        return sum + unitPrice * item.quantity;
      }, 0);

      const deliveryFee = subtotal > 0 ? (subtotal > 2000 ? 0 : 150) : 0;
      const gst = Math.round(subtotal * 0.05);
      const grandTotal = subtotal + deliveryFee + gst;

      // Filtered products for marketplace
      const filteredProducts = products.filter(p => {
        if (categoryFilter !== 'All' && p.category !== categoryFilter) return false;
        if (verifiedOnly && !p.farmerVerified) return false;
        if (p.pricePerUnit > maxPrice) return false;
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          const match = p.name.toLowerCase().includes(q) || 
                        p.farmerName.toLowerCase().includes(q) || 
                        p.farmLocation.toLowerCase().includes(q) || 
                        p.category.toLowerCase().includes(q);
          if (!match) return false;
        }
        return true;
      }).sort((a, b) => {
        if (sortBy === 'price-asc') return a.pricePerUnit - b.pricePerUnit;
        if (sortBy === 'price-desc') return b.pricePerUnit - a.pricePerUnit;
        return b.farmerRating - a.farmerRating;
